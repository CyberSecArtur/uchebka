name: StockDesk CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore StockDesk.sln
      - run: dotnet build StockDesk.sln --configuration Release --no-restore
      - name: Core and API
        run: dotnet test StockDesk.Tests/StockDesk.Tests.csproj --configuration Release --no-build --logger trx --results-directory TestResults/CoreApi --collect "XPlat Code Coverage"
      - name: WPF
        run: dotnet test StockDesk.UiTests/StockDesk.UiTests.csproj --configuration Release --no-build --logger trx --results-directory TestResults/Wpf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockdesk-test-results
          path: TestResults/
  package:
    name: Package Windows x64
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/'))
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build self-contained package
        shell: pwsh
        run: |
          dotnet publish StockDesk.Desktop/StockDesk.Desktop.csproj -c Release -r win-x64 --self-contained -o publish/client
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish StockDesk.Api/StockDesk.Api.csproj -c Release -r win-x64 --self-contained -o publish/client/server
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path publish/client/StockDesk.Desktop.exe) -or !(Test-Path publish/client/server/StockDesk.Api.exe)) {
            throw 'Expected client and server executables.'
          }
          Compress-Archive -Path publish/client/* -DestinationPath StockDesk-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash StockDesk-win-x64.zip).Hash.ToLowerInvariant()
          "$hash  StockDesk-win-x64.zip" | Set-Content StockDesk-win-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: stockdesk-windows-x64
          path: |
            StockDesk-win-x64.zip
            StockDesk-win-x64.zip.sha256
